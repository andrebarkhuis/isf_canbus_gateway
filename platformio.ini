; ISF CAN-bus gateway on the Autosport Labs ESP32-CAN-X2 (ESP32-S3-WROOM-1).
; Built and flashed with PlatformIO on the ESP-IDF framework; no Arduino.
;
;   .venv\Scripts\pio run                 compile
;   .venv\Scripts\pio run -t upload       flash over the native USB port (shows up as a COM port)
;   .venv\Scripts\pio device monitor      serial log, 115200
;
; See build-guide.md.

[platformio]
default_envs = esp32-can-x2

[env:esp32-can-x2]
platform = espressif32
board = esp32-s3-devkitc-1
framework = espidf
build_type = release
monitor_speed = 115200
upload_speed = 921600
; Upload and monitor use the ESP32-S3's native USB Serial/JTAG port (VID 303A, PID 1001).
; Leave the port unset so PlatformIO auto-detects it; set it here when more than one board is attached.
; upload_port = COM10
; monitor_port = COM10
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = partitions.csv
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
